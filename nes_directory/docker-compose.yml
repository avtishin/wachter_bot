services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=wachter
      - POSTGRES_PASSWORD=wachter
      - POSTGRES_DB=wachter
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    image: nes-alumni
    depends_on: [db]
    ports:
      - "8000:8000"
    # NES_LOGIN / NES_PASSWORD are read from creds.env (same file the CLI uses)
    env_file:
      - creds.env
    environment:
      # dashboard Basic Auth — APP_PASSWORD is required (set it in .env)
      - APP_USER=${APP_USER:-admin}
      - APP_PASSWORD=${APP_PASSWORD:?set APP_PASSWORD in .env before starting}
      - DATABASE_URL=postgresql://wachter:wachter@db:5432/wachter
      # politeness between requests
      - NES_MIN_DELAY=${NES_MIN_DELAY:-1.0}
      - NES_MAX_DELAY=${NES_MAX_DELAY:-2.5}
    volumes:
      # persist all data (raw cards, JSON exports, logs, schedule)
      - ./out:/app/out
      - ./raw_html:/app/raw_html
    restart: unless-stopped
