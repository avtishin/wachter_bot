<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NES Alumni{% endblock %}</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --ink:#1c2430; --muted:#6b7684;
          --accent:#2f6df6; --accent2:#0e9f6e; --warn:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  header { background:var(--card); border-bottom:1px solid var(--line); }
  nav { max-width:1100px; margin:0 auto; padding:14px 20px; display:flex; gap:22px; align-items:center; }
  nav .brand { font-weight:700; font-size:16px; }
  nav .sp { flex:1; }
  main { max-width:1100px; margin:0 auto; padding:24px 20px 60px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .stat .n { font-size:26px; font-weight:700; }
  .stat .l { color:var(--muted); font-size:13px; margin-top:4px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-top:20px; }
  .panel h2 { margin:0 0 12px; font-size:15px; }
  .btn { display:inline-block; border:0; border-radius:8px; padding:10px 16px; font-size:14px;
         font-weight:600; cursor:pointer; color:#fff; background:var(--accent); }
  .btn.green { background:var(--accent2); }
  .btn.ghost { background:#eef1f5; color:var(--ink); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  input, select { padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  pre.log { background:#0d1117; color:#c9d1d9; padding:12px; border-radius:8px; max-height:320px;
            overflow:auto; font-size:12px; line-height:1.5; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; background:#eef1f5; color:var(--muted); border-radius:20px;
           padding:2px 9px; font-size:12px; margin:1px 2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .pcard { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px;
           display:flex; gap:12px; }
  .avatar { width:56px; height:56px; border-radius:8px; flex:none; background:#e7eefc;
            color:var(--accent); font-weight:700; font-size:22px;
            display:flex; align-items:center; justify-content:center; }
  .avatar.big { width:120px; height:120px; border-radius:10px; font-size:44px; }
  .pcard .nm { font-weight:600; }
  .pcard .mu { color:var(--muted); font-size:12px; margin-top:3px; }
  .muted { color:var(--muted); }
  .pill { font-size:11px; padding:2px 8px; border-radius:20px; }
  .pill.new { background:#e7f6ee; color:#0e9f6e; }
  .pill.changed { background:#fff3e0; color:#b45309; }
  .pill.removed { background:#fde8e8; color:#c81e1e; }
  .pager { display:flex; gap:8px; align-items:center; margin-top:18px; }
  .kv { display:grid; grid-template-columns:190px 1fr; gap:6px 14px; }
  .kv dt { color:var(--muted); }
  .section { margin-top:22px; }
  .section h3 { font-size:14px; margin:0 0 8px; border-bottom:1px solid var(--line); padding-bottom:6px; }
</style>
</head>
<body>
<header><nav>
  <span class="brand">🎓 NES Alumni</span>
  <a href="{{ url_for('index') }}">Дашборд</a>
  <a href="{{ url_for('alumni') }}">Выпускники</a>
  <a href="{{ url_for('identities') }}">Участники чата</a>
  <a href="{{ url_for('changes') }}">Изменения</a>
  <span class="sp"></span>
  <span class="muted">my.nes.ru</span>
</nav></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
